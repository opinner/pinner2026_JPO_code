# automatically create issues from TODOs in the .tex files
# documentation at https://github.com/marketplace/actions/track-todo-action
name: TODO workflow
on:
  # only for the main branch
  push:
  # also allows for a manual start, must useful for debugging 
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Run tdg-github-action
      uses: ribtoks/tdg-github-action@master
      with:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        REF: ${{ github.ref }}
        COMMENT_ON_ISSUES: true # enables automatic comments in which commit the issue was closed
        # exclude TODOs in the files .gitignore .gitattributes .github and every file that starts with an underscore
        EXCLUDE_PATTERN: (?:\.gitignore|\.gitattributes|\.github/*|^_.*\..*$) 
        # for debugging purposes
        # DRY_RUN: true 
